name: Package and Release

on:
  push:
    tags:
      - '**'
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to package and publish (for example: 5.3.76-JuNNeZ)'
        required: true
        type: string

jobs:
  release:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write
    
    env:
      CF_API_KEY: ${{ secrets.CF_API_KEY }}
      WAGO_API_TOKEN: ${{ secrets.WAGO_API_TOKEN }}
      WOW_INTERFACE_TOKEN: ${{ secrets.WOW_INTERFACE_TOKEN }}
      WOW_INTERFACE_ADDON_ID: ${{ secrets.WOW_INTERFACE_ADDON_ID }}
      GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || github.ref }}

      - name: Resolve release tag
        id: release_tag
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          elif [ "${{ github.event_name }}" = "release" ]; then
            TAG="${{ github.event.release.tag_name }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi

          if [ -z "$TAG" ]; then
            echo "::error::Unable to resolve release tag"
            exit 1
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Resolved release tag: $TAG"

      - name: Validate release prerequisites
        shell: bash
        run: |
          FAILED=0

          if [ -z "$CF_API_KEY" ]; then
            echo "::error::Missing required repository secret: CF_API_KEY"
            FAILED=1
          fi

          if ! grep -q '^## X-Curse-Project-ID:' AzeriteUI5_JuNNeZ_Edition.toc; then
            echo "::error::Missing '## X-Curse-Project-ID:' metadata in AzeriteUI5_JuNNeZ_Edition.toc"
            FAILED=1
          fi

          if [ -z "$WAGO_API_TOKEN" ]; then
            echo "::warning::WAGO_API_TOKEN is not set; Wago upload will be skipped"
          fi

          if [ "$FAILED" -ne 0 ]; then
            exit 1
          fi
      
      - name: Create Package
        uses: BigWigsMods/packager@v2
        with:
          args: -m .pkgmeta
        env:
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
          WAGO_API_TOKEN: ${{ secrets.WAGO_API_TOKEN }}
          GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Upload to WowInterface
        if: env.WOW_INTERFACE_TOKEN != '' && env.WOW_INTERFACE_ADDON_ID != ''
        run: |
          # Extract version from resolved release tag
          VERSION="${{ steps.release_tag.outputs.tag }}"
          
          # Find the packaged zip file
          PACKAGE_ZIP=$(find . -maxdepth 1 -name "*.zip" -type f | head -1)
          
          if [ -z "$PACKAGE_ZIP" ]; then
            echo "::warning::No package ZIP found for WowInterface upload"
            exit 0
          fi
          
          echo "Uploading to WowInterface: $PACKAGE_ZIP (version: $VERSION, addon ID: $WOW_INTERFACE_ADDON_ID)"
          
          # WowInterface upload via authenticated form submission
          # Uses the token as Basic Auth or Bearer token depending on their API
          curl -X POST \
            -H "Authorization: Bearer $WOW_INTERFACE_TOKEN" \
            -F "file=@$PACKAGE_ZIP" \
            -F "version=$VERSION" \
            "https://www.wowinterface.com/addons.php?action=upload&addon=$WOW_INTERFACE_ADDON_ID" \
            --fail-with-body \
            -v
